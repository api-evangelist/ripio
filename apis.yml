name: Ripio
description: >-
  Ripio is a Latin American cryptocurrency exchange founded in 2013, offering crypto
  trading, stablecoins, DeFi products, a Visa crypto card, and B2B infrastructure and
  liquidity across Brazil, Argentina, Chile, Uruguay, Colombia, Mexico, Peru and Spain.
  Its developer-facing product is the Ripio Trade API (v4) — a REST and WebSocket
  trading API covering market data, order management, balances, statements, cryptocurrency
  deposits and withdrawals, and real-time streaming. Authentication uses an API Token plus
  HMAC-SHA256 request signing. The platform is SOC 2 Type II certified with a HackerOne bug
  bounty. Backed by Pantera Capital.
