tags:
- name: Authorization
  description: "You can create API Credentials on: <https://trade.ripio.com/market/api/token>.\n\n After\
    \ creating the **API Credentials**, you'll need to save in a safe place two pieces of information,\
    \ an **API Token** and a **Secret Key**. The credentials are required respectively to **Authenticate**\
    \ and **Sign** all Private REST Requests.\n\n **Attention**: The Secret Key can only be viewed once\
    \ and cannot be retrieved later. **If you lose the Secret Key, delete the set of credentials and create\
    \ a new one**. \n\n Each endpoint requires a type of access, which can be `Read`, `Buy/Sell`, `Cryptocurrency\
    \ withdrawals`, or can contain all of these, each one for its own function. It is possible for the\
    \ token to be `Read` only, or it may have several types, if it has any other type of access such as:\
    \ `Buy/Sell` or `Cryptocurrency withdrawals`, it will also be `Read` by default.\n\n\n## Headers\n\
    \n\nFor all private routes, these Headers are required:\n\n| Header       | Description   |\n|--------------|---------------|\n\
    | **Authorization**     | The API Token as a string.    |\n| **Timestamp**     | A timestamp in milliseconds.\
    \ See the Timestamp Security section for more details.    |\n| **Timestamp-tolerance**     | An additional,\
    \ non-required parameter, that you can send to specify the number of milliseconds after the timestamp\
    \ for the request to be valid. See the Timestamp Security section for more details.   |\n| **Signature**\
    \     | See the Generating Signature section for more details.   |\n\n## Timestamp Security\n\n Timestamp\
    \ Security is a security method to guarantee the validation of the acceptable time window, in addition\
    \ to guaranteeing the uniqueness of the request **Signature**.\n\n* **All Private Requests** also\
    \ require a **Header** parameter, **Timestamp**, which must be the timestamp in milliseconds of when\
    \ the request was created and sent. Can be generated with `Date.now()` if you're using JavaScript,\
    \ for example.\n\n* An additional parameter, **Timestamp-tolerance**, non-required, may be sent to\
    \ specify the max number of milliseconds after the timestamp, that the request is valid. If Timestamp-tolerance\
    \ is not sent, it defaults to **5000 (5 seconds)**.\n\n*  **It is recommended to use a small Timestamp-tolerance\
    \ of 5000 (5 seconds) or less. The maximum value is 60,000 (60 seconds)**. \n\n## Generating Signature\n\
    \nTo create a signature for all Private Requests, you must **encrypt** the hash-based message using\
    \ **sha256 HMAC** and encode it in **Base64**. \n\n The **message** must contain:\n\n```\nTimestamp\
    \ + HTTP Method + Path + JSON Payload\n```\n * Not including the **'+'** sign, just concatenate the\
    \ content into a string.\n\n* The **Timestamp** is the same as the one sent in the Header.\n\n* For\
    \ **GET** Requests, it is necessary to consider the **PATH** without **Query Params**. For example,\
    \ this route: `/withdrawals/estimate-rate/ADA?network=cardano_testnet`. Just `/withdrawals/estimate-fee`\
    \ is considered. Additionally, the **BODY** is considered an empty **String**.\n\n* **JSON Payload**\
    \ must be a string and must be the same as the one sent in the request **Body**.\n\n**IMPORTANT:**\
    \ To prevent an invalid signature, avoid using unnecessary decimal places in the request body properties.\
    \ For instance, use `1` instead of `1.0`. Alternatively, you can also send numbers as strings in the\
    \ request body, ensuring they are in the same format but as strings. For example:\n\n```json\n{\n\
    \  'amount': '0.01',\n  'pair': 'BTC_BRL',\n  'price': '300000', \n  'side': 'buy', \n  'type': 'limit'\n\
    }\n\n```\n\n## Examples \n\nWe provide functional examples of how to authenticate with this API, written\
    \ in various programming languages. You can find these examples in our GitHub repository: https://github.com/ripio/api."
- name: Errors
  description: "The error code is returned in the property `code` of the response body.\n\n\n## Invalid\
    \ Parameters\n\nHTTP Code: **400**\n\nAdjust the request to match what the documentation or the error\
    \ message says and try again.\n\n- **40000** - Invalid parameters.\n- **40010** - Order amount below\
    \ minimum.\n- **40011** - Insufficient funds.\n- **40020** - Order already canceled.\n- **40021**\
    \ - Order executed completely.\n- **40021** - No orders to cancel.\n- **40030** - Withdrawal limit\
    \ exceeded.\n- **40031** - Withdrawal amount below minimum.\n- **40032** - Prevention against duplicated\
    \ withdrawal. Try again after ten minutes.\n- **40033** - Destination wallet not authorized.\n- **40034**\
    \ - Non existent destination account.\n- **40035** - Minimum amount to create non existent wallet\
    \ not reached.\n- **40040** - Withdrawals temporarily blocked.\n- **40041** - Withdrawals blocked\
    \ due to TFA recovery request.\n- **40050** - TFA not enabled.\n- **40090** - Unsupported operation.\n\
    \n## Authentication\n\nHTTP Code: **401**\n\nThe authentication is necessary to access the resource.\n\
    \n- **40100** - Not authorized\n\nHTTP Code: **401**\n\n- **40100** - Blocked token\n\nContact the\
    \ support team to recover access.\n\n## Forbidden Access\n\nHTTP Code: **403**\n\nForbidden access\
    \ to the resource.\n\n- **40300** - Forbidden Access\n\n## Not found\n\nHTTP Code: **404**\n\n Check\
    \ the request URL.\n\n- **40400** - Not found\n\n## Requests limit\n\nHTTP Code: **429**\n\nWait and\
    \ try again.\n\n- **42900** - Requests limit reached\n\n## Internal server error\n\nHTTP Code: **500**\n\
    \nTry again and contact the support team in case the error persists.\n\n- **50000** - Internal server\
    \ error\n- **50001** - Error to get data\n- **50002** - External communication error\n- **50003**\
    \ - Internal communication error\n\n## Maintenance\n\nHTTP Code: **503**\n\nWait and try again.\n\n\
    - **503** - Maintenance in course"
