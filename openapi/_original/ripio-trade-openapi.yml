  securitySchemes:
    API Credentials:
      type: apiToken
      in: header
      name: Authorization
      description: "You can create API Credentials on: <https://trade.ripio.com/market/api/token>.\n\n\
        \ After creating the **API Credentials**, you'll need to save in a safe place two pieces of information,\
        \ an **API Token** and a **Secret Key**. The credentials are required respectively to **Authenticate**\
        \ and **Sign** all Private REST Requests.\n\n **Attention**: The Secret Key can only be viewed\
        \ once and cannot be retrieved later. **If you lose the Secret Key, delete the set of credentials\
        \ and create a new one**. \n\n Each endpoint requires a type of access, which can be `Read`, `Buy/Sell`,\
        \ `Cryptocurrency withdrawals`, or can contain all of these, each one for its own function. It\
        \ is possible for the token to be `Read` only, or it may have several types, if it has any other\
        \ type of access such as: `Buy/Sell` or `Cryptocurrency withdrawals`, it will also be `Read` by\
        \ default.\n\n\n## Headers\n\n\nFor all private routes, these Headers are required:\n\n| Header\
        \       | Description   |\n|--------------|---------------|\n| **Authorization**     | The API\
        \ Token as a string.    |\n| **Timestamp**     | A timestamp in milliseconds. See the Timestamp\
        \ Security section for more details.    |\n| **Timestamp-tolerance**     | An additional, non-required\
        \ parameter, that you can send to specify the number of milliseconds after the timestamp for the\
        \ request to be valid. See the Timestamp Security section for more details.   |\n| **Signature**\
        \     | See the Generating Signature section for more details.   |\n\n## Timestamp Security\n\n\
        \ Timestamp Security is a security method to guarantee the validation of the acceptable time window,\
        \ in addition to guaranteeing the uniqueness of the request **Signature**.\n\n* **All Private\
        \ Requests** also require a **Header** parameter, **Timestamp**, which must be the timestamp in\
        \ milliseconds of when the request was created and sent. Can be generated with `Date.now()` if\
        \ you're using JavaScript, for example.\n\n* An additional parameter, **Timestamp-tolerance**,\
        \ non-required, may be sent to specify the max number of milliseconds after the timestamp, that\
        \ the request is valid. If Timestamp-tolerance is not sent, it defaults to **5000 (5 seconds)**.\n\
        \n*  **It is recommended to use a small Timestamp-tolerance of 5000 (5 seconds) or less. The maximum\
        \ value is 60,000 (60 seconds)**. \n\n## Generating Signature\n\nTo create a signature for all\
        \ Private Requests, you must **encrypt** the hash-based message using **sha256 HMAC** and encode\
        \ it in **Base64**. \n\n The **message** must contain:\n\n```\nTimestamp + HTTP Method + Path\
        \ + JSON Payload\n```\n * Not including the **'+'** sign, just concatenate the content into a\
        \ string.\n\n* The **Timestamp** is the same as the one sent in the Header.\n\n* For **GET** Requests,\
        \ it is necessary to consider the **PATH** without **Query Params**. For example, this route:\
        \ `/withdrawals/estimate-rate/ADA?network=cardano_testnet`. Just `/withdrawals/estimate-fee` is\
        \ considered. Additionally, the **BODY** is considered an empty **String**.\n\n* **JSON Payload**\
        \ must be a string and must be the same as the one sent in the request **Body**.\n\n**IMPORTANT:**\
        \ To prevent an invalid signature, avoid using unnecessary decimal places in the request body\
        \ properties. For instance, use `1` instead of `1.0`. Alternatively, you can also send numbers\
        \ as strings in the request body, ensuring they are in the same format but as strings. For example:\n\
        \n```json\n{\n  'amount': '0.01',\n  'pair': 'BTC_BRL',\n  'price': '300000', \n  'side': 'buy',\
        \ \n  'type': 'limit'\n}\n\n```\n\n### Examples \n\nWe provide functional examples of how to authenticate\
        \ with this API, written in various programming languages. You can find these examples in our\
        \ GitHub repository: https://github.com/ripio/api."
      scopes:
        Read: Endpoints / token with read access.
        Buy/Sell: Endpoints / token with Buy and Sell orders access.
        Crypto Withdrawals: Endpoints / token with Crypto Withdrawals access.
        Fiat Withdrawals: Endpoints / token with Fiat Withdrawals access.
info:
  title: Ripio Trade - API Documentation
  version: v4.0
  description: "Welcome to the Ripio Trade API documentation.\n\n### Version\nThis API is currently in\
    \ the version 4.\n\nIf there is need for any big change, a new version will be launched and this version\
    \ will be maintained for at least 3 months.\n\nIf you're still using the version 3, [access the old\
    \ documentation](../v3) and check the [migration guide](#tag/V3-Endpoint-Migrations).\n\n### Important\n\
    Use the `Market` endpoints for all trading operations. The `Public` endpoints have a delay (cache)\
    \ of up to 30 seconds.\n\nAll successful requests will result in a 200 HTTP Status.\n\nAll requests\
    \ returns data in JSON format (application/json) and have a default body:\n\n\n### Success\n```\n\
    {\n  \"error_code\": null,\n  \"message\": null,\n  \"data\": { }\n}\n```\n\n### Error\n```\n{\n \
    \ \"error_code\": [Error code],\n  \"message\": \"Error description\",\n  \"data\": null\n}\n```\n\
    \n\nEndpoints that have a date filter will return data for the last 6 months if no value is sent in\
    \ the `start_date` parameter.\n\n### URL structure\nThe endpoints URL follow this pattern:\n\n`https://api.ripiotrade.co/{version}/{method}[/{parameter}][?parameter=value...]`\n\
    \n `https://api.ripiotrade.co/v4/tickers/BTC_BRL`\n\n### Limits\n\nThe request limits are based on\
    \ the user's operational limits.\n\nThere are two types of limit, one of requests per second and another\
    \ of daily requests. Both of them should be taken in consideration and the requests should be balanced\
    \ so the daily limit isn't reached.\n\nUsers **without approved documentation** have 1 request per\
    \ second or 86.400 daily requests.\n\nUsers **with approved documentation** have 3.5 requests per\
    \ second or 302.400 daily requests.\n\nThese limits can be increased, and the support team should\
    \ be contacted for that.\n\nWhen the requests per second limit is reached, the response HTTP Status\
    \ returned is 429 and the response body is:\n```\n{\n  \"message\": \"Too many requests\"\n}\n```\n\
    \nWhen the daily requests limit is reached, the response HTTP Status returned is 429 and the response\
    \ body is:\n```\n{\n  \"message\": \"Limit Exceeded\"\n}\n```"
