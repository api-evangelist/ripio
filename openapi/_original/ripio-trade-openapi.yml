- name: WebSocket Stream
  description: "Our websocket stream service provides real time updates about market data via websocket\
    \ protocol.\n## How to subscribe to topics\n\n After connected to the websocket **wss://ws.ripiotrade.co**\
    \ you should send the following json: \n```\n{\n  \"method\": \"subscribe\", \n  \"topics\": [\"topic@BASE_QUOTE\"\
    ] \n}\n```\n\n The methods available are: \n - subscribe \n - unsubscribe \n - ping \n\n## Private\
    \ topics\n\nSome of these topics require a ticket authorizing their usage, since these topics contain\
    \ sensitive user information\n\n To generate a new ticket you should send a **POST** request on <https://api.ripiotrade.co/v4/ticket>\n\
    \n You will get a response like this: \n```\n{\n  \"message\": null,\n  \"data\": { \"ticket\": \"\
    d90a9a10-06af-44af-8592-baf866dd1503\"} \n}\n```\n\n. Then you can subscribe to a private websocket\
    \ by passing right params incluing the ticket this way: \n```\n{\n  \"method\": \"subscribe\", \n\
    \  \"topics\": [\"order_status\"], \n  \"ticket\": \"d90a9a10-06af-44af-8592-baf866dd1503\" \n}\n\
    ```\n\n"
- name: WebSocket API
  description: "The WebSocket API allows you to perform trading operations (create, cancel, and update\
    \ orders) via WebSocket connection. This is separate from the WebSocket Stream service which provides\
    \ real-time market data.\n\n## General API Information\n\n- **Base endpoint**: `wss://ws-api.ripio.com`\n\
    - Connections remain active as long as there is activity; idle connections are disconnected after\
    \ **60 seconds** of inactivity\n- The WebSocket server will automatically send ping frames to maintain\
    \ connection health\n- If the WebSocket server does not receive a pong frame back from the connection\
    \ within **60 seconds**, the connection will be disconnected\n- When you receive a ping, you must\
    \ send a pong with a copy of ping's payload as soon as possible\n- Unsolicited pong frames are allowed,\
    \ but will not prevent disconnection\n- Authentication is done using **API Token, Secret, and Timestamp**\
    \ (same as REST API)\n- All timestamps are in **milliseconds** in UTC\n- All field names and values\
    \ are **case-sensitive**\n- APIs have a timeout of **10 seconds** when processing a request\n\n##\
    \ Authentication\n\nThe WebSocket API uses the same authentication mechanism as the REST API, including\
    \ API Token, Secret, and Timestamp-based signature generation.\n\nFor complete authentication details,\
    \ including signature generation, please refer to the **Authorization** section.\n\n### Key Points\
    \ for WebSocket API:\n\n- Use the same **API Token** and **Secret** from your REST API credentials\n\
    - Include `apiToken`, `timestamp`, and `signature` in the `params` object of each request\n- The signature\
    \ is generated using: **Timestamp + JSON Body (business parameters only)**\n\n### Signature Generation\
    \ for WebSocket API\n\nUnlike the REST API, the WebSocket signature is simpler because there's no\
    \ HTTP method or path:\n\n**Message to sign:** `Timestamp + JSON Body`\n\n**Where:**\n- `Timestamp`:\
    \ The same timestamp sent in the `params.timestamp` field (in milliseconds)\n- `JSON Body`: **ONLY\
    \ the business parameters** (pair, side, type, amount, price, etc.). **DO NOT include** `apiToken`,\
    \ `timestamp`, or `signature` in the body to sign.\n\n**Important:** Do NOT include `+` signs - just\
    \ concatenate the values directly.\n\n### Signature Example\n\n**Request to send:**\n```JavaScript\n\
    {\n  \"id\": \"req-001\",\n  \"method\": \"order.create\",\n  \"params\": {\n    \"pair\": \"BTC_BRL\"\
    ,\n    \"side\": \"buy\",\n    \"type\": \"limit\",\n    \"amount\": 0.001,\n    \"price\": 100000,\n\
    \    \"external_id\": \"test-limit-1761758744255\",\n    \"apiToken\": \"your-api-token\",\n    \"\
    timestamp\": 1634567890000,\n    \"signature\": \"calculated-signature\"\n  }\n}\n```\n\n**Body to\
    \ sign (only business params):**\n```JavaScript\n{\n  \"pair\": \"BTC_BRL\",\n  \"side\": \"buy\"\
    ,\n  \"type\": \"limit\",\n  \"amount\": 0.001,\n  \"price\": 100000,\n  \"external_id\": \"test-limit-1761758744255\"\
    \n}\n```\n\n**Message to sign:**\n```\n1634567890000{\"pair\":\"BTC_BRL\",\"side\":\"buy\",\"type\"\
    :\"limit\",\"amount\":0.001,\"price\":100000}\n```\n\n**Then generate HMAC SHA256 signature:**\n```javascript\n\
    const crypto = require('crypto');\nconst message = timestamp.toString() + JSON.stringify(bodyParams);\n\
    const signature = crypto.createHmac('sha256', secretKey).update(message).digest('base64');\n```\n\n\
    ## Request Format\n\nAll WebSocket API requests must follow this format:\n\n```JavaScript\n{\n  \"\
    id\": \"unique-request-id\",\n  \"method\": \"order.create\",\n  \"params\": {\n    ...body parameters...,\n\
    \    \"apiToken\": \"your-api-token\",\n    \"timestamp\": 1634567890000,\n    \"signature\": \"calculated-signature\"\
    \n  }\n}\n```\n\n## Response Format\n\n### Success Response\n\n```JavaScript\n{\n  \"id\": \"unique-request-id\"\
    ,\n  \"status\": 200,\n  \"result\": {\n    \"id\": \"7155ED34-9EC4-4733-8B32-1E4319CB662F\",\n  \
    \  \"create_date\": \"2024-03-27T13:27:19.853Z\",\n    \"executed_amount\": 0,\n    \"external_id\"\
    : \"BEAB10B1-45B0-4999-9B2F-D2ED048D6C42\",\n    \"pair\": \"BTC_BRL\",\n    \"remaining_amount\"\
    : 10,\n    \"remaining_value\": 1000,\n    \"requested_amount\": 10,\n    \"requested_value\": 1000,\n\
    \    \"side\": \"buy\",\n    \"status\": \"open\"\n  }\n}\n```\n\n### Error Response\n\n```JavaScript\n\
    {\n  \"id\": \"unique-request-id\",\n  \"status\": 400,\n  \"result\": null,\n  \"error\": {\n   \
    \ \"error_code\": 40011,\n    \"message\": \"Insufficient funds.\"\n  }\n}\n```\n\n"
x-websocket-api:
  description: "# WebSocket API\n\nThe WebSocket API allows you to perform trading operations (create,\
    \ cancel, and update orders) via WebSocket connection. This is separate from the WebSocket Stream\
    \ service which provides real-time market data.\n\n## General API Information\n\n- **Base endpoint**:\
    \ `wss://ws-api.ripio.com`\n- Connections remain active as long as there is activity; idle connections\
    \ are disconnected after **60 seconds** of inactivity\n- The WebSocket server will automatically send\
    \ ping frames to maintain connection health\n- If the WebSocket server does not receive a pong frame\
    \ back from the connection within **60 seconds**, the connection will be disconnected\n- When you\
    \ receive a ping, you must send a pong with a copy of ping's payload as soon as possible\n- Unsolicited\
    \ pong frames are allowed, but will not prevent disconnection\n- Authentication is done using **API\
    \ Token, Secret, and Timestamp** (same as REST API)\n- All timestamps are in **milliseconds** in UTC\n\
    - All field names and values are **case-sensitive**\n- APIs have a timeout of **10 seconds** when\
    \ processing a request\n\n## Authentication\n\nThe WebSocket API uses the same authentication mechanism\
    \ as the REST API, including API Token, Secret, and Timestamp-based signature generation.\n\nFor complete\
    \ authentication details, including signature generation, please refer to the **Authorization** section.\n\
    \n### Key Points for WebSocket API:\n\n- Use the same **API Token** and **Secret** from your REST\
    \ API credentials\n- Include `apiToken`, `timestamp`, and `signature` in the `params` object of each\
    \ request\n- The signature is generated using: **Timestamp + JSON Body (business parameters only)**\n\
    \n### Signature Generation for WebSocket API\n\nUnlike the REST API, the WebSocket signature is simpler\
    \ because there's no HTTP method or path:\n\n**Message to sign:** `Timestamp + JSON Body`\n\n**Where:**\n\
    - `Timestamp`: The same timestamp sent in the `params.timestamp` field (in milliseconds)\n- `JSON\
    \ Body`: **ONLY the business parameters** (pair, side, type, amount, price, etc.). **DO NOT include**\
    \ `apiToken`, `timestamp`, or `signature` in the body to sign.\n\n**Important:** Do NOT include `+`\
    \ signs - just concatenate the values directly.\n\n### Signature Example\n\n**Request to send:**\n\
    ```json\n{\n  \"id\": \"req-001\",\n  \"method\": \"order.create\",\n  \"params\": {\n    \"pair\"\
    : \"BTC_BRL\",\n    \"side\": \"buy\",\n    \"type\": \"limit\",\n    \"amount\": 0.001,\n    \"price\"\
    : 100000,\n    \"apiToken\": \"your-api-token\",\n    \"timestamp\": 1634567890000,\n    \"signature\"\
    : \"calculated-signature\"\n  }\n}\n```\n\n**Body to sign (only business params):**\n```json\n{\n\
    \  \"pair\": \"BTC_BRL\",\n  \"side\": \"buy\",\n  \"type\": \"limit\",\n  \"amount\": 0.001,\n  \"\
    price\": 100000\n}\n```\n\n**Message to sign:**\n```\n1634567890000{\"pair\":\"BTC_BRL\",\"side\"\
    :\"buy\",\"type\":\"limit\",\"amount\":0.001,\"price\":100000}\n```\n\n**Then generate HMAC SHA256\
    \ signature:**\n```javascript\nconst crypto = require('crypto');\nconst message = timestamp.toString()\
    \ + JSON.stringify(bodyParams);\nconst signature = crypto.createHmac('sha256', secretKey).update(message).digest('base64');\n\
    ```\n\n## Request Format\n\nAll WebSocket API requests must follow this format:\n\n```json\n{\n  \"\
    id\": \"unique-request-id\",\n  \"method\": \"order.create\",\n  \"params\": {\n    ...body parameters...,\n\
    \    \"apiToken\": \"your-api-token\",\n    \"timestamp\": 1634567890000,\n    \"signature\": \"calculated-signature\"\
    \n  }\n}\n```\n\n## Response Format\n\n### Success Response\n\n```json\n{\n  \"id\": \"unique-request-id\"\
    ,\n  \"status\": 200,\n  \"result\": {\n    \"id\": \"7155ED34-9EC4-4733-8B32-1E4319CB662F\",\n  \
    \  \"create_date\": \"2024-03-27T13:27:19.853Z\",\n    \"executed_amount\": 0,\n    \"external_id\"\
    : \"BEAB10B1-45B0-4999-9B2F-D2ED048D6C42\",\n    \"pair\": \"BTC_BRL\",\n    \"remaining_amount\"\
    : 10,\n    \"remaining_value\": 1000,\n    \"requested_amount\": 10,\n    \"requested_value\": 1000,\n\
    \    \"side\": \"buy\",\n    \"status\": \"open\"\n  }\n}\n```\n\n### Error Response\n\n```json\n\
    {\n  \"id\": \"unique-request-id\",\n  \"status\": 400,\n  \"result\": null,\n  \"error\": {\n   \
    \ \"error_code\": 40011,\n    \"message\": \"Insufficient funds.\"\n  }\n}\n```"
