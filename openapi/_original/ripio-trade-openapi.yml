        method:
          type: string
          enum:
          - order.create
          description: WebSocket API method
        params:
          allOf:
          - $ref: '#/components/schemas/WebSocketAuthParams'
          - anyOf:
            - $ref: '#/components/schemas/LimitBuyOrderBody'
            - $ref: '#/components/schemas/LimitSellOrderBody'
            - $ref: '#/components/schemas/MarketBuyOrderBody'
