  order.cancel:
    delete:
      summary: Cancel Order via WebSocket
      description: Cancels an active trading order via WebSocket API. You can cancel by order ID or external
        ID.
      operationId: order.cancel
      tags:
      - WebSocket API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Unique request identifier for correlation
                method:
                  type: string
                  enum:
                  - order.cancel
                  description: WebSocket API method
                params:
                  type: object
                  properties:
                    apiToken:
                      type: string
                      description: API Token for authentication
                    timestamp:
                      type: integer
                      format: int64
                      description: Timestamp in milliseconds
                    signature:
                      type: string
                      description: HMAC SHA256 signature
                    id:
                      type: string
                      description: Order ID (use either id or external_id, not both)
                    external_id:
                      type: string
                      description: External Order ID (use either id or external_id, not both)
                  required:
                  - apiToken
                  - timestamp
                  - signature
              required:
              - id
              - method
              - params
            examples:
              cancelById:
                summary: Cancel Order by ID
                value:
                  id: req-003
                  method: order.cancel
                  params:
                    apiToken: your-api-token
                    timestamp: 1634567890000
                    signature: calculated-signature
                    id: 7155ED34-9EC4-4733-8B32-1E4319CB662F
              cancelByExternalId:
                summary: Cancel Order by External ID
                value:
                  id: req-004
                  method: order.cancel
                  params:
                    apiToken: your-api-token
                    timestamp: 1634567890000
                    signature: calculated-signature
                    external_id: my-order-123
      responses:
        '200':
          description: Order canceled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketCancelResponse'
              example:
                id: req-003
                status: 200
                result:
                  id: 7155ED34-9EC4-4733-8B32-1E4319CB662F
                  create_date: '2024-03-27T13:27:19.853Z'
                  executed_amount: 0
                  remaining_amount: 0.001
                  remaining_value: 100
                  requested_amount: 0.001
