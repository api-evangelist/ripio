  order.update:
    put:
      summary: Update Order via WebSocket
      description: Updates the price and/or amount of an existing active order via WebSocket API. It is
        not possible to change a canceled or fully executed order.
      operationId: order.update
      tags:
      - WebSocket API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Unique request identifier for correlation
                method:
                  type: string
                  enum:
                  - order.update
                  description: WebSocket API method
                params:
                  type: object
                  properties:
                    apiToken:
                      type: string
                      description: API Token for authentication
                    timestamp:
                      type: integer
                      format: int64
                      description: Timestamp in milliseconds
                    signature:
                      type: string
                      description: HMAC SHA256 signature
                    id:
                      type: string
                      description: Order ID to update
                    price:
                      type: string
                      description: New unit price (optional, but at least one of price or amount must
                        be provided)
                    amount:
                      type: string
                      description: New order amount (optional, but at least one of price or amount must
                        be provided)
                  required:
                  - apiToken
                  - timestamp
                  - signature
                  - order_id
              required:
              - id
              - method
              - params
            examples:
              updatePriceAndAmount:
                summary: Update Order Price and Amount
                value:
                  id: req-005
                  method: order.update
                  params:
                    apiToken: your-api-token
                    timestamp: 1634567890000
                    signature: calculated-signature
                    id: 7155ED34-9EC4-4733-8B32-1E4319CB662F
                    price: '105000'
                    amount: '0.002'
              updatePriceOnly:
                summary: Update Order Price Only
                value:
                  id: req-006
                  method: order.update
                  params:
                    apiToken: your-api-token
                    timestamp: 1634567890000
                    signature: calculated-signature
                    id: 7155ED34-9EC4-4733-8B32-1E4319CB662F
                    price: '110000'
              updateAmountOnly:
                summary: Update Order Amount Only
                value:
                  id: req-007
                  method: order.update
                  params:
                    apiToken: your-api-token
                    timestamp: 1634567890000
                    signature: calculated-signature
                    id: 7155ED34-9EC4-4733-8B32-1E4319CB662F
                    amount: '0.003'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketUpdateResponse'
              example:
                id: req-005
                status: 200
                result: null
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketErrorResponse'
              example:
                id: req-005
                status: 400
                result: null
