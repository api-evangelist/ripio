generated: '2026-07-21'
method: searched
source: https://apidocs.ripiotrade.co/ (Errors reference)
format: custom-envelope
envelope:
  success: '{ "error_code": null, "message": null, "data": { } }'
  error: '{ "error_code": <code>, "message": "<description>", "data": null }'
  field: error_code
notes: >-
  Ripio Trade v4 does not use RFC 9457 problem+json. Every response carries a
  uniform envelope; on failure the numeric error is in error_code (documented as
  the `code` property) with a human message in `message`.
errors:
